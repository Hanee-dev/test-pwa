<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PWA Test</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <!-- iOS 홈 화면 지원 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PWA Test">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f5f5ff; color: #1e1b4b;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    @media (prefers-color-scheme: dark) { body { background: #111027; color: #e0e7ff; } }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; }
    p { margin: 0; opacity: .7; }
    .guide { margin-top: 20px; font-size: .95rem; line-height: 1.5; opacity: .85; }
    #install, #chrome { margin-top: 24px; padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 12px; background: #4f46e5; color: #fff; }
    #chrome.sub { background: transparent; color: inherit; border: 1px solid currentColor; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요 👋</h1>
    <p>PWA 테스트 페이지입니다.</p>
    <button id="install" hidden>홈 화면에 추가</button>
    <p id="guide" class="guide" hidden></p>
    <button id="chrome" class="sub" hidden>Chrome으로 열기</button>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }));
    }

    (function () {
      const ua = navigator.userAgent;
      const url = location.href;
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isKakao = /KAKAOTALK/i.test(ua);
      const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const installBtn = document.getElementById('install');
      const guide = document.getElementById('guide');
      const chromeBtn = document.getElementById('chrome');
      const showGuide = (text) => { guide.textContent = text; guide.hidden = false; };

      if (new URLSearchParams(location.search).has('debug')) {
        const d = document.createElement('pre');
        d.style.cssText = 'white-space:pre-wrap;font-size:11px;text-align:left;opacity:.6';
        d.textContent = ua;
        document.querySelector('main').append(d);
      }

      if (isStandalone) return; // 이미 설치된 앱으로 실행 중

      // 카카오톡 인앱 브라우저: 사용자의 기본 브라우저로 넘김 (특정 브라우저 강제 X)
      if (isKakao) {
        location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        showGuide('오른쪽 아래 ⋮ 메뉴에서 "다른 브라우저로 열기"를 눌러주세요.');
        return;
      }

      // 설치 버튼을 지원하는 브라우저(Chrome, 삼성 인터넷, Edge 등)
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.hidden = false;
        guide.hidden = true;
        chromeBtn.hidden = true;
      });
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      });
      window.addEventListener('appinstalled', () => { installBtn.hidden = true; });

      if (isIOS) {
        showGuide('공유 버튼(□↑) → "홈 화면에 추가"를 누르면 앱으로 설치돼요.');
        return;
      }

      // 설치 이벤트가 안 오는 브라우저(네이버 앱 등): 그 브라우저 메뉴 안내 + 원하면 Chrome으로 열기
      setTimeout(() => {
        if (deferredPrompt || !installBtn.hidden) return;
        showGuide('이 브라우저는 설치 버튼을 지원하지 않아요. 브라우저 메뉴에서 "홈 화면에 추가"를 눌러주세요.' +
          (isAndroid ? ' Chrome에서 열면 앱으로 설치할 수도 있어요.' : ''));
        if (isAndroid) {
          chromeBtn.hidden = false;
          chromeBtn.onclick = () => {
            location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
              '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
              encodeURIComponent(url) + ';end';
          };
        }
      }, 2500);
    })();
  </script>
</body>
</html>
