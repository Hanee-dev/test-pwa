<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PWA Test</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <!-- iOS 홈 화면 지원 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PWA Test">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f5f5ff; color: #1e1b4b;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    @media (prefers-color-scheme: dark) { body { background: #111027; color: #e0e7ff; } }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; }
    p { margin: 0; opacity: .7; }
    .guide { margin-top: 20px; font-size: .95rem; line-height: 1.5; opacity: .85; }
    #install, #external { margin-top: 24px; padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 12px; background: #4f46e5; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요 👋</h1>
    <p>PWA 테스트 페이지입니다.</p>
    <button id="install" hidden>홈 화면에 추가</button>
    <p id="guide" class="guide" hidden></p>
    <button id="external" hidden>외부 브라우저로 열기</button>
  </main>
  <script>
    // 인앱 브라우저(카카오톡 등)는 PWA 설치를 지원하지 않으므로 외부 브라우저로 보낸다.
    (function () {
      const ua = navigator.userAgent;
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isKakao = /KAKAOTALK/i.test(ua);
      // 안드로이드에서 진짜 Chrome이 아니면(웹뷰·네이버·삼성인터넷 등) 모두 인앱으로 간주
      const isAndroidChrome = isAndroid && /Chrome\//.test(ua) &&
        !/; wv\)|Version\/\d|NAVER|KAKAOTALK|SamsungBrowser|Whale|EdgA|OPR|DaumApps|Instagram|FB/i.test(ua);
      const isInApp = isKakao || (isAndroid && !isAndroidChrome) ||
        /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua);
      if (new URLSearchParams(location.search).has('debug')) {
        const d = document.createElement('pre');
        d.style.cssText = 'white-space:pre-wrap;font-size:11px;text-align:left;opacity:.6';
        d.textContent = ua + '\ninApp=' + isInApp;
        document.querySelector('main').append(d);
      }
      const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const guide = document.getElementById('guide');
      const extBtn = document.getElementById('external');
      const url = location.href;

      function openExternal() {
        // 안드로이드: 기본 브라우저(네이버 앱 등)가 아니라 Chrome을 직접 지정해서 연다.
        // Chrome이 없으면 browser_fallback_url로 기본 브라우저에서 열림.
        if (isAndroid) {
          location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
            encodeURIComponent(url) + ';end';
        } else if (isKakao) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        }
      }

      if (isInApp) {
        guide.hidden = false;
        guide.textContent = isIOS
          ? '앱 설치는 Safari에서만 가능해요. 오른쪽 아래 ⋯ 메뉴에서 "다른 브라우저로 열기"를 눌러주세요.'
          : '앱 설치는 Chrome에서만 가능해요. 아래 버튼을 눌러 Chrome으로 열어주세요.';
        if (isKakao || isAndroid) {
          extBtn.hidden = false;
          extBtn.addEventListener('click', openExternal);
          openExternal(); // 자동 이동 시도
        }
      } else if (isIOS && !isStandalone) {
        // iOS Safari는 설치 버튼 이벤트가 없어 안내 문구로 대체
        guide.hidden = false;
        guide.textContent = '공유 버튼(□↑) → "홈 화면에 추가"를 누르면 앱으로 설치돼요.';
      }
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }));
    }
    // Android Chrome: 설치 버튼 노출
    let deferredPrompt;
    const btn = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.hidden = false;
    });
    btn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btn.hidden = true;
    });
    window.addEventListener('appinstalled', () => { btn.hidden = true; });
  </script>
</body>
</html>
