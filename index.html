<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PWA Test</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <!-- iOS 홈 화면 지원 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PWA Test">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f5f5ff; color: #1e1b4b;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    @media (prefers-color-scheme: dark) { body { background: #111027; color: #e0e7ff; } }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; }
    p { margin: 0; opacity: .7; }
    #install, dialog button { margin-top: 24px; padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 12px; background: #4f46e5; color: #fff; }
    dialog { max-width: 320px; border: 0; border-radius: 16px; padding: 20px; text-align: center; line-height: 1.5; }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog button { margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요 👋</h1>
    <p>PWA 테스트 페이지입니다.</p>
    <button id="install">홈 화면에 추가</button>
  </main>
  <dialog id="guide">
    <p id="guide-text"></p>
    <form method="dialog"><button>확인</button></form>
  </dialog>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }));
    }

    (function () {
      const ua = navigator.userAgent;
      const url = location.href;
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isKakao = /KAKAOTALK/i.test(ua);
      // 앱 안의 웹뷰(카톡·네이버 앱·인스타 등): PWA 설치 불가
      const isWebView = isKakao || /; wv\)|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(ua);
      const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const btn = document.getElementById('install');
      const dlg = document.getElementById('guide');

      if (isStandalone) { btn.hidden = true; return; } // 이미 앱으로 실행 중

      function showGuide(text) {
        document.getElementById('guide-text').textContent = text;
        dlg.showModal();
      }
      function openChrome() {
        location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
          '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
          encodeURIComponent(url) + ';end';
      }

      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
      window.addEventListener('appinstalled', () => { btn.hidden = true; });

      btn.addEventListener('click', async () => {
        // 1) 브라우저가 설치를 지원하면 바로 설치 창
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          return;
        }
        // 2) 안드로이드 웹뷰 → Chrome에서 열기 (Chrome 없으면 기본 브라우저)
        if (isAndroid && isWebView) return openChrome();
        // 3) iOS
        if (isIOS) {
          if (isKakao) {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
            return;
          }
          if (isWebView) return showGuide('⋯ 메뉴에서 "Safari로 열기"를 누른 뒤, 공유 버튼(□↑) → "홈 화면에 추가"를 눌러주세요.');
          return showGuide('아래쪽 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 선택해주세요.');
        }
        // 4) 그 외 브라우저(삼성 인터넷·웨일·파이어폭스 등, 또는 이미 설치됨)
        showGuide('브라우저 메뉴(⋮ 또는 ≡)에서 "홈 화면에 추가" 또는 "앱 설치"를 눌러주세요. 이미 설치했다면 홈 화면의 아이콘으로 열면 돼요.');
      });

      if (new URLSearchParams(location.search).has('debug')) {
        const d = document.createElement('pre');
        d.style.cssText = 'white-space:pre-wrap;font-size:11px;text-align:left;opacity:.6';
        d.textContent = ua + '\nwebview=' + isWebView;
        document.querySelector('main').append(d);
      }
    })();
  </script>
</body>
</html>
